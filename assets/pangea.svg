<svg xmlns="http://www.w3.org/2000/svg" width="830" height="290" viewBox="0 0 830 290" role="img" aria-label="Proyecto destacado: Pangea NC">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1720"/>
    <stop offset="1" stop-color="#0F2A2A"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#4FC39A" stop-opacity=".24"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
  <radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#9BF2CF"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect width="830" height="290" rx="18"/></clipPath>
  <clipPath id="globe"><circle cx="66" cy="189" r="9"/></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .in   { opacity: 0; animation: in .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .tile { animation: tile 6s ease-in-out infinite; }
  @keyframes tile { 0%, 22%, 100% { stroke-opacity: .09; } 10% { stroke-opacity: .5; } }
  .antenna { animation: wiggle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom center; }
  @keyframes wiggle { 0%, 70%, 100% { transform: rotate(0); } 78% { transform: rotate(-14deg); } 86% { transform: rotate(12deg); } 94% { transform: rotate(-6deg); } }
  .screen { animation: screen 3s ease-in-out infinite; }
  @keyframes screen { 0%, 100% { fill-opacity: 0; } 50% { fill-opacity: .45; } }
  .check { stroke-dasharray: 20; stroke-dashoffset: 20; animation: check 6s ease-out infinite; }
  @keyframes check { 0%, 55% { stroke-dashoffset: 20; } 65%, 92% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 20; } }
  .ping { animation: ping 6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { 0%, 55% { opacity: 0; transform: scale(.5); } 60% { opacity: .8; } 80%, 100% { opacity: 0; transform: scale(2.2); } }
</style>

<g clip-path="url(#card)">
  <rect width="830" height="290" fill="url(#bg)"/>
  <circle cx="820" cy="0" r="310" fill="url(#glow)">
    <animate attributeName="r" values="310;360;310" dur="9s" repeatCount="indefinite"/>
  </circle>
  <rect x="-300" y="0" width="260" height="290" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-300;-300;1100" keyTimes="0;.6;1" dur="7s" begin="3.5s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="829" height="289" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="1" y="1" width="828" height="288" rx="17" fill="none" stroke="#6FE3B8" stroke-width="1.5" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round" opacity=".8">
  <animate attributeName="stroke-dashoffset" values="0;1000" dur="10s" repeatCount="indefinite"/>
</rect>

<g class="in">
  <rect x="32" y="26" width="160" height="24" rx="12" fill="#4FC39A" fill-opacity=".12" stroke="#4FC39A" stroke-opacity=".35"/>
  <text x="112" y="42" class="mono" font-size="10.5" font-weight="700" fill="#7FD8B4" text-anchor="middle" letter-spacing="1.2">PROYECTO DESTACADO</text>
  <text x="32" y="86" class="sans" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-.5">Pangea NC</text>
  <text x="196" y="86" class="sans" font-size="15" fill="#7D8FA0">Desviaciones y No Conformidades · Pangea Geotecnia</text>
  <text x="32" y="114" class="sans" font-size="14" fill="#C3D2DC">Plataforma que digitaliza el ciclo completo de reporte, seguimiento y cierre de No Conformidades,</text>
  <text x="32" y="134" class="sans" font-size="14" fill="#C3D2DC">desde la captura en terreno hasta la gestión en el panel web.</text>
</g>

<!-- Web: globo girando -->
<g class="in" style="animation-delay:.15s">
  <rect class="tile" style="animation-delay:4s" x="32" y="156" width="245" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#7FD8B4"/>
  <rect x="48" y="171" width="36" height="36" rx="9" fill="#4FC39A" fill-opacity=".13"/>
  <g fill="none" stroke="#7FD8B4" stroke-width="1.6">
    <circle cx="66" cy="189" r="9"/>
    <g clip-path="url(#globe)">
      <ellipse cx="66" cy="189" rx="4" ry="9"><animate attributeName="rx" values="9;0.5;9" dur="3s" repeatCount="indefinite"/></ellipse>
      <ellipse cx="66" cy="189" rx="4" ry="9"><animate attributeName="rx" values="0.5;9;0.5" dur="3s" repeatCount="indefinite"/></ellipse>
    </g>
    <path d="M57 189 H75"/><path d="M59 184 H73 M59 194 H73" stroke-opacity=".5"/>
  </g>
  <text x="98" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">Web · PWA + Panel</text>
  <text x="98" y="204" class="sans" font-size="12.5" fill="#7D8FA0">PHP · JavaScript · Shell</text>
</g>
<!-- Android -->
<g class="in" style="animation-delay:.25s">
  <rect class="tile" x="293" y="156" width="245" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#6FE3A5"/>
  <rect x="309" y="171" width="36" height="36" rx="9" fill="#3DDC84" fill-opacity=".13"/>
  <g fill="#6FE3A5"><path d="M317 195 a10 10 0 0 1 20 0 z"/><rect x="317" y="197" width="20" height="4" rx="1.5"/></g>
  <g stroke="#6FE3A5" stroke-width="1.6" stroke-linecap="round"><path class="antenna" d="M320 184 l-2.5 -4"/><path class="antenna" style="animation-delay:.1s" d="M334 184 l2.5 -4"/></g>
  <g fill="#0B1822"><circle cx="322.5" cy="190.5" r="1.3"><animate attributeName="r" values="1.3;1.3;.2;1.3;1.3" keyTimes="0;.9;.93;.96;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="331.5" cy="190.5" r="1.3"><animate attributeName="r" values="1.3;1.3;.2;1.3;1.3" keyTimes="0;.9;.93;.96;1" dur="4s" repeatCount="indefinite"/></circle></g>
  <text x="359" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">App Android</text>
  <text x="359" y="204" class="sans" font-size="12.5" fill="#7D8FA0">Kotlin · WebView seguro</text>
</g>
<!-- iOS -->
<g class="in" style="animation-delay:.35s">
  <rect class="tile" style="animation-delay:2s" x="554" y="156" width="245" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FF8A70"/>
  <rect x="570" y="171" width="36" height="36" rx="9" fill="#F05138" fill-opacity=".14"/>
  <rect class="screen" x="583" y="179" width="10" height="16" rx="1.5" fill="#FF8A70"/>
  <rect x="581" y="177" width="14" height="24" rx="3.5" fill="none" stroke="#FF8A70" stroke-width="1.6"/>
  <path d="M585.5 197.5 H590.5" stroke="#FF8A70" stroke-width="1.6" stroke-linecap="round"/>
  <text x="620" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">App iOS</text>
  <text x="620" y="204" class="sans" font-size="12.5" fill="#7D8FA0">Swift · SwiftUI · WKWebView</text>
</g>

<!-- Flujo: terreno → panel -->
<g class="in" style="animation-delay:.5s">
  <path d="M676 222 V246 H154 V222" fill="none" stroke="#7FD8B4" stroke-opacity=".18" stroke-dasharray="2 5"/>
  <path d="M415 222 V246" fill="none" stroke="#7FD8B4" stroke-opacity=".18" stroke-dasharray="2 5"/>
  <circle r="7" fill="url(#spark)"><animateMotion dur="3s" repeatCount="indefinite" path="M676 222 V246 H154 V222" keyPoints="0;1" keyTimes="0;1"/></circle>
  <circle r="7" fill="url(#spark)"><animateMotion dur="3s" begin="-1.2s" repeatCount="indefinite" path="M415 222 V246 H154 V222"/></circle>

  <g class="sans" font-size="11.5">
    <text x="415" y="270" text-anchor="middle" fill="#5F7385">Captura en terreno  →  sincronización  →  gestión y cierre</text>
  </g>
  <g transform="translate(154 262)">
    <circle r="8" fill="#4FC39A" class="ping"/>
    <circle r="8" fill="#4FC39A" fill-opacity=".2" stroke="#4FC39A" stroke-opacity=".6"/>
    <path class="check" d="M-4 0 l3 3 l5 -6" fill="none" stroke="#9BF2CF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</g>
</svg>
