<svg xmlns="http://www.w3.org/2000/svg" width="830" height="64" viewBox="0 0 830 64" role="img" aria-label="Otros proyectos">
<defs>
  <linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="200" y1="0" x2="822" y2="0"><stop offset="0" stop-color="#4FC39A" stop-opacity=".7"/><stop offset="1" stop-color="#3B8FE0" stop-opacity="0"/></linearGradient>
  <radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#9BF2CF"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
</defs>
<style>
  .t { opacity: 0; animation: t .8s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes t { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
  .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.6s cubic-bezier(.2,.8,.2,1) .3s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .diamond { transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
<g class="t">
  <rect x="6" y="18" width="46" height="28" rx="8" fill="#4FC39A" fill-opacity=".1" stroke="#4FC39A" stroke-opacity=".4"/>
  <text x="29" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#4FC39A">02</text>
  <text x="70" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#4FC39A" letter-spacing="-.3">Otros proyectos</text>
</g>
<path class="draw" d="M258 32 H822" stroke="url(#ln)" stroke-width="1.5" pathLength="1000"/>
<circle r="8" fill="url(#spark)" opacity="0">
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4s" begin="1.8s" repeatCount="indefinite"/>
  <animateMotion dur="4s" begin="1.8s" repeatCount="indefinite" path="M258 32 H822"/>
</circle>
<rect class="diamond" x="254" y="28" width="8" height="8" fill="#4FC39A" transform="rotate(45 258 32)"/>
</svg>
