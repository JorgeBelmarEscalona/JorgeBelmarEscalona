<svg xmlns="http://www.w3.org/2000/svg" width="830" height="380" viewBox="0 0 830 380" role="img" aria-label="Proyecto destacado: Gastrack">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0A1620"/>
    <stop offset="1" stop-color="#10233A"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#3B8FE0" stop-opacity=".25"/><stop offset="1" stop-color="#3B8FE0" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop offset="0" stop-color="#4FC39A" stop-opacity=".14"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
  <radialGradient id="spark"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".35" stop-color="#8CC2F5"/><stop offset="1" stop-color="#3B8FE0" stop-opacity="0"/></radialGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".06"/>
    <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3B8FE0" stop-opacity="0"/>
    <stop offset=".1" stop-color="#3B8FE0" stop-opacity=".5"/>
    <stop offset=".9" stop-color="#4FC39A" stop-opacity=".5"/>
    <stop offset="1" stop-color="#4FC39A" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="card"><rect width="830" height="380" rx="18"/></clipPath>
  <clipPath id="tank"><rect x="57" y="178" width="18" height="22" rx="6"/></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .in   { opacity: 0; animation: in .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.6); } }
  .tile { animation: tile 8s ease-in-out infinite; }
  @keyframes tile { 0%, 20%, 100% { stroke-opacity: .09; } 8% { stroke-opacity: .45; } }
  .dots circle { animation: dot 1.2s ease-in-out infinite; }
  @keyframes dot { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .bounce { animation: bounce 1.6s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
</style>

<g clip-path="url(#card)">
  <rect width="830" height="380" fill="url(#bg)"/>
  <circle cx="820" cy="0" r="330" fill="url(#glow)">
    <animate attributeName="r" values="330;380;330" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="380" r="260" fill="url(#glow2)"/>
  <!-- barrido de luz -->
  <rect x="-300" y="0" width="260" height="380" fill="url(#sweep)" transform="skewX(-20)">
    <animate attributeName="x" values="-300;-300;1100" keyTimes="0;.6;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x=".5" y=".5" width="829" height="379" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="1" y="1" width="828" height="378" rx="17" fill="none" stroke="#5AA9F0" stroke-width="1.5" pathLength="1000" stroke-dasharray="70 930" stroke-linecap="round" opacity=".8">
  <animate attributeName="stroke-dashoffset" values="0;-1000" dur="10s" repeatCount="indefinite"/>
</rect>

<!-- Encabezado -->
<g class="in">
  <rect x="32" y="26" width="160" height="24" rx="12" fill="#3B8FE0" fill-opacity=".13" stroke="#3B8FE0" stroke-opacity=".4"/>
  <text x="112" y="42" class="mono" font-size="10.5" font-weight="700" fill="#8CC2F5" text-anchor="middle" letter-spacing="1.2">PROYECTO DESTACADO</text>
  <text x="32" y="86" class="sans" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-.5">Gastrack</text>
  <text x="170" y="86" class="sans" font-size="15" fill="#7D8FA0">Trazabilidad de cilindros de gas · logística multi-empresa</text>
  <text x="32" y="114" class="sans" font-size="14" fill="#C3D2DC">Ecosistema completo para controlar inventario, despachos y flota: desde el escaneo del cilindro en</text>
  <text x="32" y="134" class="sans" font-size="14" fill="#C3D2DC">terreno hasta la guía de despacho, el ruteo de camiones y los reportes para cada cliente.</text>
</g>
<g class="in" style="animation-delay:.1s">
  <circle cx="786" cy="38" r="4" fill="#4FC39A"/>
  <circle cx="786" cy="38" r="4" fill="#4FC39A" class="pulse"/>
  <text x="774" y="42" class="sans" font-size="12" font-weight="600" fill="#7FD8B4" text-anchor="end">En desarrollo activo</text>
</g>

<!-- Flujo de datos por los espacios entre cajas -->
<g class="in" style="animation-delay:.5s">
  <path d="M415 156 V300 M32 228 H798" stroke="#8CC2F5" stroke-opacity=".12" stroke-dasharray="2 5"/>
  <circle r="9" fill="url(#spark)"><animateMotion dur="3.2s" repeatCount="indefinite" path="M415 156 V300"/></circle>
  <circle r="7" fill="url(#spark)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M32 228 H798"/></circle>
  <circle r="7" fill="url(#spark)"><animateMotion dur="4.5s" begin="-2.25s" repeatCount="indefinite" path="M798 228 H32"/></circle>
</g>

<!-- Plataforma web: cilindro llenándose -->
<g class="in" style="animation-delay:.15s">
  <rect class="tile" x="32" y="156" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#8CC2F5"/>
  <rect x="48" y="171" width="36" height="36" rx="9" fill="#3B8FE0" fill-opacity=".15"/>
  <g clip-path="url(#tank)">
    <rect x="57" y="200" width="18" height="22" fill="#3B8FE0" fill-opacity=".55">
      <animate attributeName="y" values="200;182;182;200" keyTimes="0;.45;.8;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g fill="none" stroke="#8CC2F5" stroke-width="1.6" stroke-linejoin="round">
    <rect x="57" y="178" width="18" height="22" rx="6"/><path d="M62 178 v-3 h8 v3"/>
  </g>
  <text x="98" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">Plataforma web</text>
  <text x="98" y="204" class="sans" font-size="12.5" fill="#7D8FA0">PHP · MySQL · JavaScript · QR · integración SII</text>
</g>

<!-- App Android: escáner -->
<g class="in" style="animation-delay:.25s">
  <rect class="tile" style="animation-delay:2s" x="421" y="156" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#6FE3A5"/>
  <rect x="437" y="171" width="36" height="36" rx="9" fill="#3DDC84" fill-opacity=".13"/>
  <g fill="none" stroke="#6FE3A5" stroke-width="1.6" stroke-linecap="round">
    <path d="M446 182 v-3 a2 2 0 0 1 2 -2 h3"/><path d="M459 177 h3 a2 2 0 0 1 2 2 v3"/>
    <path d="M464 196 v3 a2 2 0 0 1 -2 2 h-3"/><path d="M451 201 h-3 a2 2 0 0 1 -2 -2 v-3"/>
  </g>
  <rect x="449" y="180" width="12" height="1.8" rx=".9" fill="#9BF2CF">
    <animate attributeName="y" values="180;197;180" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.5;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <text x="487" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">App Android para operadores</text>
  <text x="487" y="204" class="sans" font-size="12.5" fill="#7D8FA0">Kotlin · Compose · CameraX · ML Kit</text>
</g>

<!-- API -->
<g class="in" style="animation-delay:.35s">
  <rect class="tile" style="animation-delay:4s" x="32" y="234" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#C4B5FD"/>
  <rect x="48" y="249" width="36" height="36" rx="9" fill="#A78BFA" fill-opacity=".15"/>
  <text x="54" y="272" class="mono" font-size="15" font-weight="700" fill="#C4B5FD">{</text>
  <text x="78" y="272" class="mono" font-size="15" font-weight="700" fill="#C4B5FD" text-anchor="end">}</text>
  <g class="dots" fill="#C4B5FD">
    <circle cx="62" cy="267" r="1.4"/><circle cx="66" cy="267" r="1.4" style="animation-delay:.2s"/><circle cx="70" cy="267" r="1.4" style="animation-delay:.4s"/>
  </g>
  <text x="98" y="263" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">API REST móvil</text>
  <text x="98" y="282" class="sans" font-size="12.5" fill="#7D8FA0">PHP · JSON · autenticación · versionado</text>
</g>

<!-- Rutas -->
<g class="in" style="animation-delay:.45s">
  <rect class="tile" style="animation-delay:6s" x="421" y="234" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FBBF24"/>
  <rect x="437" y="249" width="36" height="36" rx="9" fill="#F59E0B" fill-opacity=".14"/>
  <ellipse cx="455" cy="279" rx="4" ry="1.3" fill="#FBBF24" opacity=".35"/>
  <g class="bounce" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M455 276 s-7 -7 -7 -12 a7 7 0 0 1 14 0 c0 5 -7 12 -7 12 z"/><circle cx="455" cy="264" r="2.2"/>
  </g>
  <text x="487" y="263" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">Rutas, flota y bodega</text>
  <text x="487" y="282" class="sans" font-size="12.5" fill="#7D8FA0">Leaflet · OpenRouteService · GPS · NFC · Docker</text>
</g>

<!-- Ruta con camión -->
<g class="in" style="animation-delay:.6s">
  <path id="route" d="M40 346 C 150 322, 230 366, 330 344 S 520 322, 610 346 S 740 360, 790 340" fill="none" stroke="url(#road)" stroke-width="2" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" values="0;-24" dur="1s" repeatCount="indefinite"/>
  </path>

  <g font-size="10.5" class="sans" fill="#7D8FA0">
    <g><circle cx="40" cy="346" r="4" fill="#3B8FE0"/><circle cx="40" cy="346" r="4" fill="#3B8FE0" class="pulse"/><text x="40" y="368" text-anchor="middle">Bodega</text></g>
    <g><circle cx="330" cy="344" r="4" fill="#8CC2F5"/><circle cx="330" cy="344" r="4" fill="#8CC2F5" class="pulse" style="animation-delay:.8s"/><text x="330" y="366" text-anchor="middle">Cliente A</text></g>
    <g><circle cx="610" cy="346" r="4" fill="#6FE3A5"/><circle cx="610" cy="346" r="4" fill="#6FE3A5" class="pulse" style="animation-delay:1.6s"/><text x="610" y="368" text-anchor="middle">Cliente B</text></g>
    <g><circle cx="790" cy="340" r="4" fill="#4FC39A"/><circle cx="790" cy="340" r="4" fill="#4FC39A" class="pulse" style="animation-delay:2.4s"/><text x="790" y="328" text-anchor="middle">Entrega</text></g>
  </g>

  <!-- Camión -->
  <g>
    <animateMotion dur="9s" repeatCount="indefinite" rotate="auto" keyPoints="0;.36;.36;.7;.7;1" keyTimes="0;.3;.4;.7;.8;1" calcMode="linear">
      <mpath href="#route"/>
    </animateMotion>
    <g transform="translate(-13 -15)">
      <rect x="0" y="3" width="17" height="11" rx="2" fill="#3B8FE0"/>
      <path d="M17 6 h5 l4 4 v4 h-9 z" fill="#8CC2F5"/>
      <rect x="19" y="7" width="3.5" height="3" rx=".6" fill="#0A1620"/>
      <circle cx="5" cy="15" r="2.4" fill="#0A1620" stroke="#8CC2F5" stroke-width="1.2"/>
      <circle cx="21" cy="15" r="2.4" fill="#0A1620" stroke="#8CC2F5" stroke-width="1.2"/>
      <rect x="3" y="6" width="3" height="5" rx="1.5" fill="#FFFFFF" fill-opacity=".7"/>
      <rect x="8" y="6" width="3" height="5" rx="1.5" fill="#FFFFFF" fill-opacity=".7"/>
      <rect x="13" y="6" width="3" height="5" rx="1.5" fill="#FFFFFF" fill-opacity=".7"/>
    </g>
  </g>
</g>
</svg>
