<svg xmlns="http://www.w3.org/2000/svg" width="830" height="330" viewBox="0 0 830 330" role="img" aria-label="Proyecto destacado: Gastrack">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0B1822"/>
    <stop offset="1" stop-color="#10233A"/>
  </linearGradient>
  <radialGradient id="glow"><stop offset="0" stop-color="#3B8FE0" stop-opacity=".22"/><stop offset="1" stop-color="#3B8FE0" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop offset="0" stop-color="#4FC39A" stop-opacity=".12"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="830" height="330" rx="18"/></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
  .in   { opacity: 0; animation: in .7s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .pulse { animation: pulse 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0% { opacity: .7; transform: scale(.6); } 100% { opacity: 0; transform: scale(2.2); } }
</style>
<g clip-path="url(#card)">
  <rect width="830" height="330" fill="url(#bg)"/>
  <circle cx="820" cy="0" r="320" fill="url(#glow)"/>
  <circle cx="0" cy="330" r="260" fill="url(#glow2)"/>
</g>
<rect x=".5" y=".5" width="829" height="329" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

<g class="in">
  <rect x="32" y="26" width="160" height="24" rx="12" fill="#3B8FE0" fill-opacity=".13" stroke="#3B8FE0" stroke-opacity=".4"/>
  <text x="112" y="42" class="mono" font-size="10.5" font-weight="700" fill="#8CC2F5" text-anchor="middle" letter-spacing="1.2">PROYECTO DESTACADO</text>
  <text x="32" y="86" class="sans" font-size="28" font-weight="800" fill="#FFFFFF" letter-spacing="-.5">Gastrack</text>
  <text x="170" y="86" class="sans" font-size="15" fill="#7D8FA0">Trazabilidad de cilindros de gas · logística multi-empresa</text>
  <text x="32" y="114" class="sans" font-size="14" fill="#C3D2DC">Ecosistema completo para controlar inventario, despachos y flota: desde el escaneo del cilindro en</text>
  <text x="32" y="134" class="sans" font-size="14" fill="#C3D2DC">terreno hasta la guía de despacho, el ruteo de camiones y los reportes para cada cliente.</text>
</g>
<g class="in" style="animation-delay:.1s">
  <circle cx="776" cy="44" r="4" fill="#4FC39A"/>
  <circle cx="776" cy="44" r="4" fill="#4FC39A" class="pulse"/>
  <text x="764" y="48" class="sans" font-size="12" font-weight="600" fill="#7FD8B4" text-anchor="end">En desarrollo activo</text>
</g>

<!-- Plataforma web -->
<g class="in" style="animation-delay:.15s">
  <rect x="32" y="156" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="48" y="171" width="36" height="36" rx="9" fill="#3B8FE0" fill-opacity=".15"/>
  <g fill="none" stroke="#8CC2F5" stroke-width="1.6" stroke-linejoin="round">
    <rect x="57" y="178" width="18" height="22" rx="6"/><path d="M62 178 v-3 h8 v3"/><path d="M57 188 h18"/>
  </g>
  <text x="98" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">Plataforma web</text>
  <text x="98" y="204" class="sans" font-size="12.5" fill="#7D8FA0">PHP · MySQL · JavaScript · QR · integración SII</text>
</g>
<!-- App Android -->
<g class="in" style="animation-delay:.25s">
  <rect x="421" y="156" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="437" y="171" width="36" height="36" rx="9" fill="#3DDC84" fill-opacity=".13"/>
  <g fill="none" stroke="#6FE3A5" stroke-width="1.6" stroke-linecap="round">
    <path d="M446 182 v-3 a2 2 0 0 1 2 -2 h3"/><path d="M459 177 h3 a2 2 0 0 1 2 2 v3"/>
    <path d="M464 196 v3 a2 2 0 0 1 -2 2 h-3"/><path d="M451 201 h-3 a2 2 0 0 1 -2 -2 v-3"/><path d="M450 189 h10"/>
  </g>
  <text x="487" y="185" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">App Android para operadores</text>
  <text x="487" y="204" class="sans" font-size="12.5" fill="#7D8FA0">Kotlin · Compose · CameraX · ML Kit</text>
</g>
<!-- API -->
<g class="in" style="animation-delay:.35s">
  <rect x="32" y="234" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="48" y="249" width="36" height="36" rx="9" fill="#A78BFA" fill-opacity=".15"/>
  <text x="66" y="272" class="mono" font-size="15" font-weight="700" fill="#C4B5FD" text-anchor="middle">{ }</text>
  <text x="98" y="263" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">API REST móvil</text>
  <text x="98" y="282" class="sans" font-size="12.5" fill="#7D8FA0">PHP · JSON · autenticación · versionado</text>
</g>
<!-- Rutas -->
<g class="in" style="animation-delay:.45s">
  <rect x="421" y="234" width="377" height="66" rx="12" fill="#FFFFFF" fill-opacity=".035" stroke="#FFFFFF" stroke-opacity=".09"/>
  <rect x="437" y="249" width="36" height="36" rx="9" fill="#F59E0B" fill-opacity=".14"/>
  <g fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M455 277 s-7 -7 -7 -12 a7 7 0 0 1 14 0 c0 5 -7 12 -7 12 z"/><circle cx="455" cy="265" r="2.2"/>
  </g>
  <text x="487" y="263" class="sans" font-size="14" font-weight="700" fill="#E6EDF3">Rutas, flota y bodega</text>
  <text x="487" y="282" class="sans" font-size="12.5" fill="#7D8FA0">Leaflet · OpenRouteService · GPS · NFC · Docker</text>
</g>
</svg>
