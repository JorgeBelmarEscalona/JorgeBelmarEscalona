<svg xmlns="http://www.w3.org/2000/svg" width="830" height="170" viewBox="0 0 830 170" role="img" aria-label="Gracias por visitar">
<defs>
  <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#143852"/><stop offset="1" stop-color="#367962"/></linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#367962"/><stop offset="1" stop-color="#1F5A6B"/></linearGradient>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="1"/></linearGradient>
  <mask id="m"><rect width="830" height="170" fill="url(#fade)"/></mask>
  <clipPath id="c"><rect width="830" height="170" rx="18"/></clipPath>
</defs>
<style>
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .beat { transform-box: fill-box; transform-origin: center; animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.18); } }
</style>
<g clip-path="url(#c)" mask="url(#m)">
  <g opacity=".55">
    <path fill="url(#w2)" d="M0 120 Q 104 95 207 120 T 415 120 T 622 120 T 830 120 T 1037 120 T 1245 120 T 1452 120 T 1660 120 V170 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="0 0;-830 0" dur="16s" repeatCount="indefinite"/>
    </path>
  </g>
  <g opacity=".85">
    <path fill="url(#w1)" d="M0 135 Q 104 155 207 135 T 415 135 T 622 135 T 830 135 T 1037 135 T 1245 135 T 1452 135 T 1660 135 V170 H0 Z">
      <animateTransform attributeName="transform" type="translate" values="-830 0;0 0" dur="11s" repeatCount="indefinite"/>
    </path>
  </g>
</g>
<text x="415" y="48" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4FC39A">Gracias por pasar por aquí <tspan class="beat" fill="#4FC39A">♥</tspan></text>
<text x="415" y="74" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#7D8FA0">while (true) { construir(); aprender(); mejorar(); }<tspan class="blink" fill="#4FC39A">▍</tspan></text>
</svg>
