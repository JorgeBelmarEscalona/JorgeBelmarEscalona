<svg xmlns="http://www.w3.org/2000/svg" width="830" height="300" viewBox="0 0 830 300" role="img" aria-label="Jorge Belmar — Software Developer · Web &amp; Mobile">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07111A"/>
    <stop offset="1" stop-color="#0D2433"/>
  </linearGradient>
  <radialGradient id="glowA"><stop offset="0" stop-color="#4FC39A" stop-opacity=".45"/><stop offset="1" stop-color="#4FC39A" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB"><stop offset="0" stop-color="#2D6E9E" stop-opacity=".55"/><stop offset="1" stop-color="#2D6E9E" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowC"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".22"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></radialGradient>

  <!-- Brillo que cruza el nombre -->
  <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".42" stop-color="#FFFFFF"/>
    <stop offset=".5" stop-color="#9BF2CF"/>
    <stop offset=".58" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FFFFFF"/>
    <animate attributeName="x1" values="-300;420;420" keyTimes="0;.35;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;720;720" keyTimes="0;.35;1" dur="6s" repeatCount="indefinite"/>
  </linearGradient>


  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#FFFFFF" fill-opacity=".05"/></pattern>
  <clipPath id="card"><rect width="830" height="300" rx="18"/></clipPath>

  <!-- Máscaras de escritura para las frases -->
  <clipPath id="type0"><rect x="46" y="186" height="28" width="0">
    <animate attributeName="width" values="0;290;290;0;0" keyTimes="0;.1;.27;.32;1" dur="12s" begin="0s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;.5 0 .5 1;0 0 1 1"/>
  </rect></clipPath>
  <clipPath id="type1"><rect x="46" y="186" height="28" width="0">
    <animate attributeName="width" values="0;290;290;0;0" keyTimes="0;.1;.27;.32;1" dur="12s" begin="4s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;.5 0 .5 1;0 0 1 1"/>
  </rect></clipPath>
  <clipPath id="type2"><rect x="46" y="186" height="28" width="0">
    <animate attributeName="width" values="0;290;290;0;0" keyTimes="0;.1;.27;.32;1" dur="12s" begin="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;0 0 1 1;.5 0 .5 1;0 0 1 1"/>
  </rect></clipPath>
  <clipPath id="cmd"><rect x="520" y="96" height="20" width="0">
    <animate attributeName="width" values="0;0;140;140;0" keyTimes="0;.04;.16;.94;1" dur="10s" repeatCount="indefinite"/>
  </rect></clipPath>
</defs>
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .in   { opacity: 0; animation: in .9s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .l1 { animation: l1 10s infinite; } .l2 { animation: l2 10s infinite; } .l3 { animation: l3 10s infinite; }
  @keyframes l1 { 0%, 42% { opacity: 0; } 45%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l2 { 0%, 47% { opacity: 0; } 50%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
  @keyframes l3 { 0%, 52% { opacity: 0; } 55%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .chip { animation: chip 7.5s ease-in-out infinite; }
  @keyframes chip { 0%, 12%, 100% { stroke-opacity: .3; fill-opacity: .1; } 5% { stroke-opacity: 1; fill-opacity: .28; } }
  .float { animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { animation: status 10s infinite; }
  @keyframes status { 0%, 60% { opacity: 0; } 63%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
  .working { animation: working 10s infinite; }
  @keyframes working { 0%, 15% { opacity: 0; } 17%, 39% { opacity: 1; } 42%, 100% { opacity: 0; } }
</style>

<!-- Fondo -->
<g clip-path="url(#card)">
  <rect width="830" height="300" fill="url(#bg)"/>
  <rect width="830" height="300" fill="url(#dots)"/>
  <circle cx="700" cy="30" r="250" fill="url(#glowA)">
    <animate attributeName="cx" values="700;590;700" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;110;30" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="320" r="270" fill="url(#glowB)">
    <animate attributeName="cx" values="90;230;90" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="-40" r="200" fill="url(#glowC)">
    <animate attributeName="cx" values="420;300;420" dur="22s" repeatCount="indefinite"/>
  </circle>

  <!-- Partículas -->
  <g fill="#9BF2CF">
    <circle cx="80"  r="1.6"><animate attributeName="cy" values="310;-10" dur="9s"  repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="210" r="1.2"><animate attributeName="cy" values="310;-10" dur="12s" begin="-4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="12s" begin="-4s" repeatCount="indefinite"/></circle>
    <circle cx="350" r="1.8"><animate attributeName="cy" values="310;-10" dur="10s" begin="-7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="10s" begin="-7s" repeatCount="indefinite"/></circle>
    <circle cx="455" r="1.2"><animate attributeName="cy" values="310;-10" dur="14s" begin="-2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="14s" begin="-2s" repeatCount="indefinite"/></circle>
    <circle cx="560" r="1.5"><animate attributeName="cy" values="310;-10" dur="11s" begin="-9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.7;0" dur="11s" begin="-9s" repeatCount="indefinite"/></circle>
    <circle cx="690" r="1.3"><animate attributeName="cy" values="310;-10" dur="13s" begin="-5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.6;0" dur="13s" begin="-5s" repeatCount="indefinite"/></circle>
    <circle cx="800" r="1.7"><animate attributeName="cy" values="310;-10" dur="9.5s" begin="-3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.8;0" dur="9.5s" begin="-3s" repeatCount="indefinite"/></circle>
    <circle cx="140" r="1.1"><animate attributeName="cy" values="310;-10" dur="15s" begin="-11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="15s" begin="-11s" repeatCount="indefinite"/></circle>
    <circle cx="620" r="1.1"><animate attributeName="cy" values="310;-10" dur="16s" begin="-13s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.5;0" dur="16s" begin="-13s" repeatCount="indefinite"/></circle>
  </g>
</g>

<!-- Borde + luz recorriéndolo -->
<rect x=".5" y=".5" width="829" height="299" rx="17.5" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
<rect x="1" y="1" width="828" height="298" rx="17" fill="none" stroke="#6FE3B8" stroke-width="1.6" pathLength="1000" stroke-dasharray="90 910" stroke-linecap="round" opacity=".85">
  <animate attributeName="stroke-dashoffset" values="1000;0" dur="9s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="828" height="298" rx="17" fill="none" stroke="#5AA9F0" stroke-width="1.6" pathLength="1000" stroke-dasharray="60 940" stroke-dashoffset="500" stroke-linecap="round" opacity=".7">
  <animate attributeName="stroke-dashoffset" values="500;-500" dur="9s" repeatCount="indefinite"/>
</rect>

<!-- Texto -->
<g class="in">
  <text x="48" y="78" class="mono" font-size="13" fill="#4FC39A" letter-spacing="1.5">HOLA, SOY</text>
  <rect x="136" y="67" width="22" height="2" fill="#4FC39A" opacity=".6"><animate attributeName="width" values="0;22;0" dur="4s" repeatCount="indefinite"/></rect>
</g>
<text x="46" y="132" class="sans in" style="animation-delay:.1s" font-size="50" font-weight="800" fill="url(#name)" letter-spacing="-1">Jorge Belmar</text>
<text x="48" y="166" class="sans in" style="animation-delay:.2s" font-size="19" font-weight="500" fill="#A9BDCB">Software Developer · Web &amp; Mobile</text>

<!-- Frases escribiéndose -->
<g class="mono" font-size="14.5" fill="#D6E4EC">
  <g clip-path="url(#type0)"><text x="48" y="205"><tspan fill="#4FC39A">›</tspan> Logística, trazabilidad y flota_</text></g>
  <g clip-path="url(#type1)"><text x="48" y="205"><tspan fill="#4FC39A">›</tspan> Apps nativas Android e iOS_</text></g>
  <g clip-path="url(#type2)"><text x="48" y="205"><tspan fill="#4FC39A">›</tspan> Software simple, rápido y seguro_</text></g>
</g>

<!-- Chips con pulso secuencial -->
<g class="sans in" style="animation-delay:.35s" font-size="12" font-weight="600">
  <rect class="chip" x="48"  y="228" width="58"  height="28" rx="14" fill="#4FC39A" stroke="#4FC39A"/>
  <text x="77"  y="246" text-anchor="middle" fill="#9BF2CF">Web</text>
  <rect class="chip" style="animation-delay:1.5s" x="114" y="228" width="80"  height="28" rx="14" fill="#4FC39A" stroke="#4FC39A"/>
  <text x="154" y="246" text-anchor="middle" fill="#9BF2CF">Android</text>
  <rect class="chip" style="animation-delay:3s" x="202" y="228" width="50"  height="28" rx="14" fill="#4FC39A" stroke="#4FC39A"/>
  <text x="227" y="246" text-anchor="middle" fill="#9BF2CF">iOS</text>
  <rect class="chip" style="animation-delay:4.5s" x="260" y="228" width="72"  height="28" rx="14" fill="#3B8FE0" stroke="#3B8FE0"/>
  <text x="296" y="246" text-anchor="middle" fill="#A9D2F8">Python</text>
  <rect class="chip" style="animation-delay:6s" x="340" y="228" width="112" height="28" rx="14" fill="#3B8FE0" stroke="#3B8FE0"/>
  <text x="396" y="246" text-anchor="middle" fill="#A9D2F8">Automatización</text>
</g>

<!-- Terminal flotante -->
<g class="in" style="animation-delay:.25s">
<g class="float">
  <rect x="486" y="50" width="300" height="200" rx="12" fill="#050B11" fill-opacity=".85" stroke="#FFFFFF" stroke-opacity=".1"/>
  <path d="M486 76 H786" stroke="#FFFFFF" stroke-opacity=".07"/>
  <circle cx="504" cy="63" r="5" fill="#FF5F57" fill-opacity=".85"/>
  <circle cx="521" cy="63" r="5" fill="#FEBC2E" fill-opacity=".85"/>
  <circle cx="538" cy="63" r="5" fill="#28C840" fill-opacity=".85"/>
  <text x="636" y="67" class="mono" font-size="11" fill="#5F7385" text-anchor="middle">jorge@oxycom — zsh</text>

  <g class="mono" font-size="12.5">
    <text x="504" y="110" fill="#4FC39A">❯</text>
    <g clip-path="url(#cmd)"><text x="520" y="110" fill="#E6EDF3">git push --all</text></g>

    <!-- Progreso -->
    <g class="working">
      <g transform="translate(509 128)"><path class="spin" d="M-5 0 A5 5 0 0 1 5 0" fill="none" stroke="#4FC39A" stroke-width="1.8" stroke-linecap="round"/></g>
      <text x="522" y="132" fill="#7D8FA0">desplegando…</text>
      <rect x="620" y="124" width="146" height="8" rx="4" fill="#FFFFFF" fill-opacity=".08"/>
      <rect x="620" y="124" width="0" height="8" rx="4" fill="#4FC39A">
        <animate attributeName="width" values="0;0;146;146" keyTimes="0;.17;.39;1" dur="10s" repeatCount="indefinite"/>
      </rect>
    </g>

    <text x="504" y="132" class="l1"><tspan fill="#4FC39A">✓</tspan><tspan x="522" fill="#E6EDF3">gastrack</tspan><tspan x="600" fill="#7D8FA0">PHP · Kotlin</tspan></text>
    <text x="504" y="154" class="l2"><tspan fill="#4FC39A">✓</tspan><tspan x="522" fill="#E6EDF3">rutas</tspan><tspan x="600" fill="#7D8FA0">GPS · NFC</tspan></text>
    <text x="504" y="176" class="l3"><tspan fill="#4FC39A">✓</tspan><tspan x="522" fill="#E6EDF3">pangea</tspan><tspan x="600" fill="#7D8FA0">Swift · PWA</tspan></text>
    <text x="504" y="204" class="status"><tspan fill="#4FC39A" font-weight="700">✔ listo</tspan><tspan fill="#5F7385">  3 proyectos · 0 errores</tspan></text>
    <text x="504" y="230" fill="#4FC39A">❯ <tspan class="blink">▍</tspan></text>
  </g>
</g>
</g>
</svg>
