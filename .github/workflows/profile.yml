name: Actualizar perfil

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tarjetas de estadísticas
        run: python3 scripts/generate_stats.py
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
          OUT_DIR: dist

      - name: Snake de contribuciones
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#367962&color_dots=#ebedf0,#AFC3D2,#5FA88C,#367962,#143852
            dist/snake-dark.svg?palette=github-dark&color_snake=#4FC39A&color_dots=#161b22,#143852,#1F5A6B,#367962,#4FC39A

      - name: Publicar en rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
